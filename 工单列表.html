<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>工单系统 · NetShort 管理系统</title>
<style>
/* ============================================================
   NetShort 管理系统 · 公共样式（基线：版权开放平台 demo）
   ============================================================ */
:root{
  --brand:#ff2e63;--brand-dark:#e0244f;--brand-light:#fff0f4;--brand-weak:rgba(255,46,99,.06);
  --brand-grad:linear-gradient(135deg,#ff5c8a 0%,#ff2e63 100%);
  --bg:#f7f8fa;--fill-1:#f7f8fa;--fill-2:#eef0f3;--card:#fff;
  --border:#eef0f3;--border-strong:#e2e5ea;
  --text:#1f2329;--text-2:#51565d;--text-3:#8a9199;
  --ok:#16b364;--warn:#f0a020;--danger:#e5484d;--info:#3b82f6;
  --radius-card:12px;--radius-btn:8px;--radius-input:8px;
  --shadow-card:0 2px 12px rgba(20,24,30,.06);--shadow-pop:0 8px 30px rgba(20,24,30,.14);
  --sidebar-w:220px;--topbar-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text);background:var(--bg);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}ul,ol{list-style:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,select,textarea{font-family:inherit;font-size:14px;}
/* ---------- 顶栏 ---------- */
.topbar{position:sticky;top:0;z-index:100;background:#fff;height:var(--topbar-h);border-bottom:1px solid var(--border);}
.topbar-inner{max-width:1440px;margin:0 auto;padding:0 24px;height:100%;display:flex;align-items:center;justify-content:space-between;}
.topbar-left{display:flex;align-items:center;gap:12px;}
.topbar-logo{width:30px;height:30px;border-radius:8px;background:var(--brand-grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;}
.topbar-title{font-size:15px;font-weight:600;}
.topbar-divider{width:1px;height:16px;background:var(--border-strong);}
.topbar-sub{font-size:13px;color:var(--text-3);}
.topbar-right{display:flex;align-items:center;gap:20px;}
.topbar-icon{width:20px;height:20px;color:var(--text-2);position:relative;display:flex;align-items:center;cursor:pointer;}
.topbar-icon .dot{position:absolute;top:-2px;right:-2px;width:7px;height:7px;border-radius:50%;background:var(--brand);border:1.5px solid #fff;}
.topbar-user{display:flex;align-items:center;gap:8px;cursor:pointer;}
.topbar-avatar{width:28px;height:28px;border-radius:50%;background:var(--brand-grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;}
.topbar-name{font-size:14px;}
/* ---------- 布局 ---------- */
.layout{display:flex;min-height:calc(100vh - var(--topbar-h));max-width:1440px;margin:0 auto;}
.sidebar{width:var(--sidebar-w);flex-shrink:0;padding:20px 12px;}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:11px 14px;margin-bottom:4px;border-radius:8px;color:var(--text-2);font-size:14px;cursor:pointer;transition:background .15s,color .15s;}
.sidebar-item:hover{background:var(--fill-2);color:var(--text);}
.sidebar-item.active{background:var(--brand-weak);color:var(--brand);font-weight:600;}
.sidebar-item svg{width:18px;height:18px;flex-shrink:0;}
.content{flex:1;min-width:0;padding:24px 32px 48px;}
/* ---------- 页面 ---------- */
.card{background:var(--card);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:24px;margin-bottom:20px;}
/* ---------- 按钮 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 20px;border-radius:var(--radius-btn);font-size:14px;font-weight:500;line-height:1.4;transition:all .15s;white-space:nowrap;}
.btn-primary{background:var(--brand);color:#fff;}
.btn-primary:hover{background:var(--brand-dark);}
.btn-outline{border:1px solid var(--border-strong);color:var(--text-2);background:#fff;}
.btn-outline:hover{border-color:var(--brand);color:var(--brand);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-danger:hover{opacity:.9;}
.btn-sm{padding:6px 14px;font-size:13px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.op-link{font-size:13px;color:var(--brand);cursor:pointer;margin-right:12px;}
.op-link:hover{text-decoration:underline;}
.link{background:none;border:none;color:var(--brand);cursor:pointer;font-size:12px;padding:0;}
.link:hover{color:var(--brand-dark);}
.link.danger{color:var(--danger);}
.link:disabled{color:var(--text-3);cursor:not-allowed;}
/* ---------- 表单 ---------- */
.form-item{margin-bottom:18px;}
.form-label{display:block;font-size:13px;color:var(--text-2);margin-bottom:7px;}
.form-label .req{color:var(--danger);margin-right:2px;}
.ant-input{height:32px;padding:4px 11px;border:1px solid #d9d9d9;border-radius:6px;font-size:14px;color:var(--text);outline:none;background:#fff;transition:all .2s;width:100%;}
.ant-input:hover{border-color:var(--brand);}
.ant-input:focus{border-color:var(--brand);box-shadow:0 0 0 2px rgba(255,46,99,.1);}
.ant-input::placeholder{color:#bfbfbf;}
textarea.ant-input{height:auto;padding:8px 11px;resize:vertical;min-height:80px;line-height:1.6;}
.form-item.has-error .ant-input{border-color:var(--danger);}
.form-item .error{font-size:12px;color:var(--danger);margin-top:5px;display:none;}
.form-item.has-error .error{display:block;}
input[type=checkbox],input[type=radio]{accent-color:var(--brand);cursor:pointer;}
/* ---------- 筛选区 ---------- */
.filter-box{background:#fafbfc;border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:16px;}
.prio-row{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap;}
.prio-row .plabel{font-size:13px;color:var(--text-2);}
.cb-group{display:flex;gap:16px;flex-wrap:wrap;}
.cb-group label{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text);cursor:pointer;}
.sf-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 16px;}
#sf-main{grid-template-columns:.95fr .65fr .8fr 1.6fr;}
.search-item{display:flex;flex-direction:column;gap:6px;min-width:0;}
.search-item label{font-size:12px;color:var(--text-3);}
.filter-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:14px;}
.ops-row{display:flex;gap:12px;margin-bottom:14px;}
/* ---------- 表格 ---------- */
.table-wrap{overflow-x:auto;}
.table{width:100%;border-collapse:collapse;}
.table th,.table td{text-align:center;padding:13px 14px;border-bottom:1px solid var(--border);font-size:13px;}
.table th{color:var(--text-3);font-weight:500;background:#fafbfc;white-space:nowrap;}
.table tr:last-child td{border-bottom:none;}
.table tbody tr:hover{background:#fafbfc;}
.table .cell-title{font-weight:500;}
.table td.cell-diff{text-align:left;line-height:1.7;}
.diff-text{white-space:pre-line;display:inline-block;max-width:100%;}
.cell-dots{color:var(--text-3);letter-spacing:1px;}
.empty{text-align:center;padding:48px 20px;color:var(--text-3);}
.empty .empty-icon{font-size:40px;margin-bottom:12px;opacity:.5;}
/* ---------- 徽标 ---------- */
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:500;line-height:1.5;}
.tag-gray{background:#f0f1f3;color:#6b7280;}
.tag-blue{background:#e8f1ff;color:#2f6bdc;}
.tag-pink{background:var(--brand-light);color:var(--brand);}
.tag-green{background:#e7f7ef;color:#16a34a;}
/* ---------- 分页 ---------- */
.pagination{display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:16px 0 0;font-size:13px;color:var(--text-2);}
.pagination .page{min-width:30px;height:30px;padding:0 8px;border:1px solid var(--border-strong);border-radius:6px;background:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--text-2);font-size:13px;}
.pagination .page.active{background:var(--brand);border-color:var(--brand);color:#fff;}
.pagination .page:disabled{opacity:.4;cursor:not-allowed;}
/* ---------- 下拉多选 ---------- */
.ms-wrap{position:relative;}
.ms-box{min-height:32px;width:180px;padding:2px 28px 2px 6px;border:1px solid #d9d9d9;border-radius:6px;background:#fff;cursor:pointer;display:flex;align-items:center;flex-wrap:wrap;gap:3px;transition:all .2s;position:relative;}
.ms-box:hover{border-color:var(--brand);}
.ms-box.open{border-color:var(--brand);box-shadow:0 0 0 2px rgba(255,46,99,.1);}
.ms-placeholder{color:#bfbfbf;font-size:14px;padding:0 5px;}
.ms-tag{display:inline-flex;align-items:center;height:22px;padding:0 6px;background:#fafafa;border:1px solid #d9d9d9;border-radius:4px;font-size:12px;color:var(--text-2);margin:1px 0;max-width:170px;}
.ms-tag .ms-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ms-tag .ms-x{margin-left:4px;color:#999;cursor:pointer;font-size:12px;line-height:1;}
.ms-tag .ms-x:hover{color:var(--brand);}
.ms-arrow{position:absolute;right:9px;top:50%;transform:translateY(-50%);color:#bfbfbf;pointer-events:none;transition:transform .2s;display:flex;}
.ms-box.open .ms-arrow{transform:translateY(-50%) rotate(180deg);}
.ms-panel{position:absolute;top:calc(100% + 4px);left:0;z-index:80;width:100%;min-width:160px;background:#fff;border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,.12);padding:4px;display:none;max-height:260px;overflow-y:auto;}
.ms-panel.show{display:block;}
.ms-panel.flip-up{top:auto;bottom:calc(100% + 4px);}
.ms-opt{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:4px;font-size:13px;cursor:pointer;color:var(--text-2);transition:background .15s;}
.ms-opt:hover{background:#f5f5f5;}
.ms-opt.disabled{color:#c8cdd4;cursor:not-allowed;}
.ms-opt .opt-check{width:16px;text-align:center;color:var(--brand);font-weight:700;visibility:hidden;}
.ms-opt.checked .opt-check{visibility:visible;}
.ms-opt.checked{color:var(--brand);font-weight:600;}
.ms-opt.ms-selall{color:var(--brand);font-weight:500;}
.ms-sep{height:1px;background:var(--border);margin:4px 0;}
/* ---------- 弹窗 ---------- */
.modal-mask{position:fixed;inset:0;z-index:200;background:rgba(20,24,30,.45);display:none;align-items:flex-start;justify-content:center;padding:32px 24px;overflow-y:auto;}
.modal-mask.show{display:flex;}
.modal{background:#fff;border-radius:14px;width:820px;max-width:96vw;display:flex;flex-direction:column;box-shadow:var(--shadow-pop);animation:pop .18s ease;margin:0 auto;}
.modal-xl{width:1080px;}
.modal-xxl{width:1240px;}
@keyframes pop{from{transform:scale(.96);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal-head{padding:22px 24px 0;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.modal-title{font-size:16px;font-weight:600;}
.modal-close{width:22px;height:22px;color:var(--text-3);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.modal-close:hover{color:var(--text);}
.modal-body{padding:0 24px;overflow-y:auto;flex:1;}
.modal-foot{padding:16px 24px 22px;flex-shrink:0;display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
/* ---------- toast ---------- */
#toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:400;background:#fff;padding:10px 20px;border-radius:8px;box-shadow:var(--shadow-pop);font-size:13px;display:none;align-items:center;gap:8px;max-width:80vw;}
#toast.show{display:flex;animation:pop .2s ease;}
#toast.success{color:var(--ok);}#toast.error{color:var(--danger);}#toast.warning{color:var(--warn);}
/* ============================================================
   工单页面私有
   ============================================================ */
.cw-type-row{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.cw-type-row .form-label{margin:0;flex-shrink:0;}
.cw-panel{display:none;}
.cw-panel.show{display:block;}
.cw-cols{display:flex;gap:40px;align-items:flex-start;}
.cw-col-left{width:284px;flex-shrink:0;}
.cw-col-right{flex:1;min-width:0;}
.radio-group{display:flex;gap:24px;flex-wrap:wrap;}
.radio-opt{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:14px;color:var(--text);}
.env-list{display:flex;flex-direction:column;gap:12px;}
.env-item{display:flex;flex-direction:column;gap:8px;}
.env-item > label{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--text);cursor:pointer;}
.env-sub{margin-left:24px;display:flex;flex-direction:column;gap:12px;border-left:2px solid var(--fill-2);padding-left:16px;}
.env-sub .sub-row{display:flex;align-items:flex-start;gap:10px;}
.env-sub .sub-label{font-size:13px;color:var(--text-2);padding-top:5px;flex-shrink:0;}
.env-sub .sub-label .req{color:var(--danger);margin-right:2px;}
/* 语言组（顶部标题栏 + 场景模式 + 场景详情） */
.lg-block{border:1px solid var(--border-strong);border-radius:10px;margin-bottom:12px;overflow:hidden;}
.lg-top{display:flex;align-items:center;gap:12px;background:#f7f8fa;padding:10px 16px;border-bottom:1px solid var(--border);}
.lg-title{font-weight:600;font-size:13px;flex-shrink:0;}
.lg-title .idx{color:var(--text-3);font-weight:400;}
.lang-pick{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2);}
.lang-pick .ms-box{width:260px;}
.lg-top .spacer{flex:1;}
.lg-body{padding:14px;}
.btn-del-lang{flex-shrink:0;font-size:12px;}
.mode-row{display:flex;align-items:center;gap:20px;padding-bottom:10px;margin-bottom:12px;border-bottom:1px dashed var(--border);}
.mode-row .mr-label{font-size:13px;color:var(--text-2);flex-shrink:0;}
.lg-scene-item{margin-bottom:0;width:420px;max-width:100%;}
.remark-row{display:flex;gap:12px;margin-top:14px;}
.remark-row .form-label{margin:0;padding-top:5px;flex-shrink:0;width:86px;}
.remark-row textarea{flex:1;}
/* ---------- 场景详情编辑器（组结构，同差异化场景管理） ---------- */
.grp-card{border:1px solid var(--border-strong);border-radius:10px;padding:12px 14px;margin-bottom:12px;background:#fff;}
.grp-card.invalid{border-color:var(--danger);box-shadow:0 0 0 2px rgba(229,72,77,.06);}
.grp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.grp-title{font-size:13px;font-weight:600;color:var(--text);}
.grp-del{font-size:12px;color:var(--danger);cursor:pointer;}
.grp-del:hover{text-decoration:underline;}
.grp-body{display:flex;}
.grp-col.name-col{width:320px;flex-shrink:0;padding-right:18px;border-right:1px solid var(--border);}
.grp-col.cover-col{flex:1;min-width:0;padding-left:18px;}
.grp-top-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.grp-tip{font-size:12px;color:var(--text-3);}
/* 语言 hover tooltip */
#app-tip{position:fixed;z-index:500;background:#1f2329;color:#fff;padding:8px 12px;border-radius:8px;font-size:12px;line-height:1.8;max-width:380px;pointer-events:none;display:none;box-shadow:0 8px 30px rgba(0,0,0,.25);}
.cfg-btn.disabled{border-color:#d9d9d9;color:#c0c6cc;background:#fafafa;cursor:not-allowed;}
.cfg-btn.disabled:hover{background:#fafafa;}
.cfg-chip.app-merge,.tag.app-merge{background:#e8f1ff;color:#2f6bdc;cursor:default;}
.cover-idx{flex-shrink:0;min-width:22px;height:22px;border-radius:4px;background:var(--fill-2);color:var(--text-2);font-size:12px;display:inline-flex;align-items:center;justify-content:center;margin-top:3px;}
.lg-count-tip{font-size:12px;color:var(--text-3);white-space:nowrap;flex-shrink:0;}
.pick-disabled td{color:#c0c6cc;}
.pick-disabled input{cursor:not-allowed;}
.grp-label{font-size:12px;color:var(--text-3);margin-bottom:6px;}
.cfg-box{border:1px solid #d9d9d9;border-radius:6px;background:#fff;padding:4px 8px;min-height:36px;display:flex;align-items:flex-start;gap:8px;transition:border .2s;}
.cfg-box:hover{border-color:var(--brand);}
.cfg-box.invalid{border-color:var(--danger);box-shadow:0 0 0 2px rgba(229,72,77,.08);}
.cfg-chips{flex:1;display:flex;flex-wrap:wrap;gap:4px;padding:2px 0;min-width:0;}
.cfg-ph{color:#bfbfbf;font-size:13px;padding:2px 0;}
.cfg-chip{display:inline-flex;align-items:center;height:22px;padding:0 7px;background:var(--brand-light);color:var(--brand);border-radius:4px;font-size:12px;max-width:100%;}
.cfg-btn{flex-shrink:0;margin:2px 0;border:1px solid var(--brand);color:var(--brand);border-radius:5px;padding:3px 10px;font-size:12px;cursor:pointer;line-height:1.4;background:#fff;white-space:nowrap;}
.cfg-btn:hover{background:var(--brand-light);}
.cover-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;}
.cover-main{flex:1;min-width:0;}
.cfg-del{flex-shrink:0;margin-top:3px;border:1px solid var(--danger);color:var(--danger);border-radius:5px;padding:4px 12px;font-size:12px;cursor:pointer;background:#fff;line-height:1.4;}
.cfg-del:hover{background:#fdeaea;}
.cfg-err{font-size:12px;color:var(--danger);margin-top:4px;display:none;line-height:1.5;}
.cfg-err.show{display:block;}
.grp-err{font-size:12px;color:var(--danger);margin-top:8px;display:none;line-height:1.5;}
.grp-err.show{display:block;}
.btn-dashed{width:100%;border:1px dashed #d9d9d9;border-radius:8px;padding:8px 0;font-size:13px;color:var(--text-2);background:#fff;transition:all .15s;margin-top:2px;cursor:pointer;}
.btn-dashed:hover{border-color:var(--brand);color:var(--brand);}
/* ---------- 选择应用子页面 ---------- */
.pick-selected-box{border:1px solid var(--border-strong);border-radius:8px;background:#fff;padding:10px 12px;margin-bottom:12px;}
.pick-selected-box .ps-head{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--text-3);margin-bottom:8px;}
.pick-selected-box .ps-head .ps-title{font-weight:500;color:var(--text-2);}
.pick-selected-box .ps-head b{color:var(--brand);font-weight:600;}
.pick-selected-box .ps-tags{display:flex;flex-wrap:wrap;gap:6px;}
.ps-chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;background:var(--brand-light);color:var(--brand);border-radius:5px;font-size:12px;}
.ps-empty{color:#bfbfbf;font-size:13px;padding:2px 0;}
.pick-filter-box{background:#fafbfc;border:1px solid var(--border);border-radius:8px;padding:12px 14px 6px;margin-bottom:12px;}
.pick-filter{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
.pick-table-wrap{border:1px solid var(--border);border-radius:8px;overflow-y:auto;max-height:300px;}
.pick-table-wrap .table th{position:sticky;top:0;z-index:2;}
#picker-modal{z-index:230;}
/* ---------- 自定义场景详情查看 ---------- */
.vw-grp{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:10px;}
.vw-grp-title{font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:8px;}
.vw-row{display:flex;margin-bottom:6px;align-items:flex-start;}
.vw-row:last-child{margin-bottom:0;}
.vw-label{width:52px;flex-shrink:0;font-size:12px;color:var(--text-3);padding-top:3px;}
.vw-chips{flex:1;display:flex;flex-wrap:wrap;gap:4px;}
.vw-lg{border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:12px;}
.vw-lg:last-child{margin-bottom:0;}
.vw-lg .vw-grp{background:var(--fill-1);border-style:dashed;}
/* ---------- 差异化详情：应用折叠 + 全部应用弹窗 ---------- */
#drama-diff-panel .vw-chips .tag{padding:2px 7px;font-size:11px;line-height:1.6;}
.vw-more{display:inline-flex;align-items:center;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:500;line-height:1.6;color:var(--brand);background:var(--brand-light);border:1px dashed rgba(255,46,99,.35);cursor:pointer;transition:all .15s;}
.vw-more:hover{background:#ffe3ec;border-color:var(--brand);}
.ddp-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px;}
.ddp-sub{font-size:12px;color:var(--text-3);margin-bottom:14px;}
.ddp-table{border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.ddp-table table{width:100%;border-collapse:collapse;table-layout:fixed;}
.ddp-table th{background:#fbfbfd;font-size:12px;color:var(--text-3);font-weight:500;text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);}
.ddp-table td{font-size:13px;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ddp-table tr:last-child td{border-bottom:none;}
.ddp-table tbody tr:hover td{background:var(--fill-1);}
/* 批量导入 */
.upload-box{border:1.5px dashed #d9d9d9;border-radius:10px;padding:22px;text-align:center;color:var(--text-3);font-size:13px;cursor:pointer;transition:all .15s;margin-bottom:14px;}
.upload-box:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-weak);}
.upload-box.has-file{border-style:solid;border-color:var(--ok);color:var(--ok);background:#f0faf5;}
.tpl-note{font-size:13px;color:var(--text-2);margin-bottom:10px;}
.tpl-note a{color:var(--brand);cursor:pointer;}
.tpl-help th{background:#fbfbfd;color:var(--text-3);font-size:11px;text-align:left;line-height:1.5;font-weight:400;white-space:normal;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--border);}
.table-wrap > .table{table-layout:fixed;width:100%;}
.batch-table{table-layout:fixed;width:100%;}
.batch-table td{white-space:normal;}
/* ---------- 批量差异化弹窗间距 ---------- */
#batch-modal .radio-group{gap:22px;}
#batch-modal .pick-filter{gap:16px 22px;}
#batch-modal .pick-filter .search-item{gap:8px;}
#batch-modal .pick-table-wrap{margin-top:14px;}
#batch-modal .mode-row{padding-bottom:12px;margin-bottom:14px;}
#batch-modal .remark-row{margin-top:18px;gap:14px;}
/* ---------- 差异化需求模块化（模块标题/字段层级/子模块） ---------- */
.diff-module{border:1px solid var(--border-strong);border-radius:10px;padding:18px 20px;margin-bottom:18px;background:#fff;}
.diff-module-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:16px;line-height:1.4;}
.diff-field-label{display:block;font-size:13px;font-weight:500;color:var(--text-2);margin-bottom:8px;}
.diff-field-label .req{color:var(--danger);margin-right:2px;}
.diff-submod{background:var(--fill-1);border:1px solid var(--border);border-radius:8px;padding:14px 16px;}
.diff-detail-head{display:flex;align-items:center;margin-bottom:10px;}
.diff-detail-head .diff-field-label{margin-bottom:0;margin-right:14px;}
/* ---------- 工单环节 tab（参照生产总览：下划线式） ---------- */
.env-tabs{display:flex;gap:32px;border-bottom:1px solid var(--border);margin-bottom:18px;}
.env-tab{position:relative;padding:10px 2px 12px;font-size:14px;color:var(--text-2);cursor:pointer;transition:color .15s;white-space:nowrap;}
.env-tab .cnt{font-size:12px;color:var(--text-3);margin-left:2px;font-weight:400;}
.env-tab:hover{color:var(--text);}
.env-tab.active{color:var(--brand);font-weight:600;}
.env-tab.active .cnt{color:var(--brand);}
.env-tab.active::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--brand);border-radius:2px;}
/* ---------- 差异化列（语言 icons + 套数，每组一行、居中、每组最多 3 语言） ---------- */
.diff-line{display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;}
.diff-line + .diff-line{margin-top:8px;}
.diff-unit{font-size:13px;color:var(--text-2);white-space:nowrap;}
.lg-icon{flex-shrink:0;display:inline-block;padding:0 6px;background:#e8f1ff;color:#2f6bdc;border-radius:4px;font-size:12px;line-height:20px;}
.lg-total{flex-shrink:0;font-size:12px;color:var(--brand);cursor:default;white-space:nowrap;}
#lang-tip{position:fixed;z-index:500;background:#1f2329;color:#fff;padding:8px 12px;border-radius:8px;font-size:12px;line-height:1.8;max-width:380px;pointer-events:none;display:none;box-shadow:0 8px 30px rgba(0,0,0,.25);}
/* ---------- 剧本编号子项 ---------- */
.cell-sub{margin-top:4px;font-size:12px;color:var(--text-3);display:flex;align-items:center;justify-content:center;gap:4px;}
.copy-ico{display:inline-flex;color:var(--text-3);cursor:pointer;vertical-align:-2px;}
.copy-ico:hover{color:var(--brand);}
.poster-thumb{border-radius:6px;background:var(--fill-2);display:inline-flex;align-items:center;justify-content:center;font-size:16px;}

/* 复用场景 */
.lg-reuse-item{width:460px;max-width:100%;}
/* ---------- 场景模式 / 选择场景 ---------- */
.mode-row .radio-group{display:flex;align-items:center;gap:20px;}
.lg-scene-pick{display:flex;align-items:center;gap:10px;}
.lg-scene-pick select{flex:1;min-width:0;}
.lg-scene-pick .btn[disabled]{opacity:.5;cursor:not-allowed;}
.lg-scene-item.has-error select{border-color:var(--danger);}
/* ---------- 应用下拉单选（选择应用） ---------- */
.ss-wrap{position:relative;}
.ss-panel{position:fixed;z-index:1400;left:0;top:0;width:220px;background:#fff;border:1px solid #e5e6eb;border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.1);max-height:340px;overflow:auto;padding:4px 0;display:none;}
.ss-panel.show{display:block;}
.ss-opt{padding:7px 12px;font-size:13px;color:var(--text);cursor:pointer;}
.ss-opt:hover{background:var(--fill-2);}
.ss-empty{padding:10px 12px;font-size:12px;color:var(--text-3);text-align:center;}
.ss-sub{float:right;margin-left:10px;color:var(--text-3);font-size:12px;font-style:normal;}
/* 选择应用：多选（chips + 搜索框 + 勾选面板） */
.cfg-search{flex:0 0 96px;height:26px;margin:2px 0;border:none;border-left:1px solid var(--border);padding:0 0 0 8px;font-size:12px;background:transparent;outline:none;color:var(--text);}
.cfg-search::placeholder{color:#bfbfbf;}
.cfg-x{margin-left:5px;font-style:normal;font-size:12px;cursor:pointer;opacity:.55;}
.cfg-x:hover{opacity:1;}
.ss-opt.checked{color:var(--brand);background:var(--brand-light);}
.ss-check{display:inline-block;width:14px;font-style:normal;color:var(--brand);opacity:0;}
.ss-opt.checked .ss-check{opacity:1;}
/* ---------- 场景详情 / 复用场景 弹窗 ---------- */
#scene-detail-modal,#reuse-scene-modal{z-index:1500;}
.sd-name{font-size:14px;font-weight:600;margin-bottom:4px;}
.sd-meta{font-size:12px;color:var(--text-3);margin-bottom:12px;}
.sd-grp{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:10px;background:var(--fill-1);}
.sd-grp-title{font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:8px;}
.sd-row{display:flex;gap:8px;margin-bottom:6px;align-items:flex-start;}
.sd-row:last-child{margin-bottom:0;}
.sd-label{flex-shrink:0;width:56px;font-size:12px;color:var(--text-3);line-height:22px;}
.sd-chips{display:flex;flex-wrap:wrap;gap:4px;}
.sd-chip{display:inline-flex;align-items:center;height:22px;padding:0 7px;background:var(--brand-light);color:var(--brand);border-radius:4px;font-size:12px;}
/* ---------- 列表：差异化套数 ---------- */
.diff-num{font-size:13px;color:var(--text);}
</style>
</head>

/* ================= Toast ================= */
let toastTimer = null;
function toast(msg, type='success'){
  const icons = {success:'✓', error:'✕', warning:'!'};
  const el = document.getElementById('toast');
  el.className = 'show ' + type;
  el.innerHTML = '<span>' + icons[type] + '</span>' + msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.className = ''; }, 2600);
}

/* ================= 下拉多选（支持全选） ================= */
function initMs(boxId, contentId, panelId, options, onChange, selectAll){
  const box = document.getElementById(boxId);
  const content = document.getElementById(contentId);
  const panel = document.getElementById(panelId);
  const selected = new Set();
  const disabled = new Set();
  function buildPanel(){
    let html = '';
    if(selectAll){
      html += '<div class="ms-opt ms-selall" data-v="__all__"><span class="opt-check">✓</span><span>全选</span></div><div class="ms-sep"></div>';
    }
    html += options.map(o => '<div class="ms-opt'+(disabled.has(o)?' disabled':'')+'" data-v="'+o+'"><span class="opt-check">✓</span><span>'+o+'</span></div>').join('');
    panel.innerHTML = html;
    renderPanel();
  }
  function renderBox(){
    content.innerHTML = '';
    if(selected.size === 0){
      content.innerHTML = '<span class="ms-placeholder">请选择</span>';
    }else{
      const arr = [...selected];
      arr.slice(0,2).forEach(v => { content.insertAdjacentHTML('beforeend','<span class="ms-tag" title="'+v+'"><span class="ms-t">'+v+'</span><span class="ms-x">×</span></span>'); });
      if(arr.length > 2) content.insertAdjacentHTML('beforeend','<span class="ms-tag more">+'+(arr.length-2)+'</span>');
      content.querySelectorAll('.ms-x').forEach(x => {
        x.addEventListener('click', e => {
          e.stopPropagation();
          selected.delete(x.parentElement.getAttribute('title') || '');
          renderBox(); renderPanel();
          onChange && onChange([...selected]);
        });
      });
    }
  }
  function renderPanel(){
    panel.querySelectorAll('.ms-opt').forEach(o => {
      const v = o.getAttribute('data-v');
      if(v === '__all__'){
        const nd = options.filter(x=>!disabled.has(x));
        o.classList.toggle('checked', nd.length>0 && nd.every(x=>selected.has(x)));
      }else{
        o.classList.toggle('checked', selected.has(v));
      }
    });
  }
  box.addEventListener('click', e => {
    if(e.target.closest('.ms-x')) return;
    const isOpen = panel.classList.contains('show');
    document.querySelectorAll('.ms-panel.show').forEach(p=>{ if(p!==panel) p.classList.remove('show'); });
    document.querySelectorAll('.ms-box.open').forEach(b=>{ if(b!==box) b.classList.remove('open'); });
    panel.classList.toggle('show', !isOpen);
    box.classList.toggle('open', !isOpen);
    if(!isOpen){
      panel.classList.remove('flip-up');
      panel.style.maxHeight = '';
      requestAnimationFrame(() => {
        const pr = panel.getBoundingClientRect();
        if(pr.height === 0) return;
        const mb = panel.closest('.modal-body');
        const limBottom = mb ? mb.getBoundingClientRect().bottom : window.innerHeight - 8;
        const limTop = mb ? mb.getBoundingClientRect().top : 8;
        if(pr.bottom > limBottom){
          panel.classList.add('flip-up');
          const pr2 = panel.getBoundingClientRect();
          if(pr2.top < limTop){
            panel.classList.remove('flip-up');
            const boxRect = box.getBoundingClientRect();
            const avail = limBottom - boxRect.bottom - 8;
            if(avail > 120){ panel.style.maxHeight = Math.floor(avail) + 'px'; }
          }
        }
      });
    }
  });
  panel.addEventListener('click', e => {
    const opt = e.target.closest('.ms-opt');
    if(!opt || opt.classList.contains('disabled')) return;
    const v = opt.getAttribute('data-v');
    if(v === '__all__'){
      const nd = options.filter(x=>!disabled.has(x));
      const allSel = nd.length>0 && nd.every(x=>selected.has(x));
      if(allSel){ nd.forEach(x=>selected.delete(x)); } else { nd.forEach(x=>selected.add(x)); }
    }else{
      if(selected.has(v)) selected.delete(v); else selected.add(v);
    }
    renderBox(); renderPanel();
    onChange && onChange([...selected]);
  });
  document.addEventListener('click', e => {
    if(!box.contains(e.target) && !panel.contains(e.target)){ panel.classList.remove('show'); box.classList.remove('open'); }
  });
  buildPanel(); renderBox();
  return {
    get value(){ return [...selected]; },
    setValue(arr){ selected.clear(); (arr||[]).forEach(a=>selected.add(a)); renderBox(); renderPanel(); },
    clear(){ selected.clear(); renderBox(); renderPanel(); },
    setDisabled(arr){ disabled.clear(); (arr||[]).forEach(a=>disabled.add(a)); buildPanel(); },
  };
}

/* ================= 列表 ================= */
const listFilter = {priority:['P0+','P0','P1','P2'], drama:'', series:'', form:'', langs:''};
let envTab = 'loc'; /* 工单环节 tab：loc 本地化 / poster 海报 */
/* 语言组剧名/剧封套数（common 展开场景，custom 直取 groups/covers） */
function diffSetCounts(d){
  let ns = 0, cs = 0;
  /* 优先按已存的剧名/剧封套配置统计（配置可与常用场景混用、再编辑），兜底才回落到场景 */
  if(d.groups && d.groups.length){
    ns = d.groups.length; cs = d.groups.reduce((a,g) => a + g.covers.length, 0);
  }else if(d.covers && d.covers.length){
    cs = d.covers.length;
  }else{
    const sc = scenes.find(x => x.id === d.sceneId);
    if(sc){
      if(sc.type === 'cover_only'){ cs = sc.covers.length; }
      else { ns = sc.groups.length; cs = sc.groups.reduce((a,g) => a + g.covers.length, 0); }
    }
  }
  return {ns, cs};
}
/* 环节差异化列：工单已具体到剧本-语言，此处只展示该维度的剧名/剧封需求套数（纯数字） */
function envDiffCell(o, kind){
  let total = 0;
  (o.diffs || []).forEach(d => {
    const cnt = diffSetCounts(d);
    total += (kind === 'loc' ? cnt.ns : cnt.cs);
  });
  return '<span class="diff-num">'+total+'</span>';
}
function filteredOrders(){
  return orders.filter(o => {
    if(listFilter.priority.length && !listFilter.priority.includes(o.priority)) return false;
    if(listFilter.drama && !o.drama.toLowerCase().includes(listFilter.drama.toLowerCase())) return false;
    if(listFilter.series && o.series !== listFilter.series) return false;
    if(listFilter.form && o.type !== listFilter.form) return false;
    if(listFilter.langs){
      const ls = new Set();
      (o.diffs || []).forEach(d => d.langs.forEach(l => ls.add(l)));
      if(!ls.has(listFilter.langs)) return false;
    }
    return true;
  });
}

  }

      '<td><input type="checkbox"></td>' +

      '<td>'+o.createWay+'</td>' +

        '<span class="copy-ico" title="复制编号" data-copy="'+o.dramaNo+'"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></span></div></td>' +
      '<td>'+envDiffCell(o, envTab)+'</td>' +
      '<td>'+o.series+'</td>' +
      '<td><a class="op-link" href="'+jumpHref+'" style="margin:0;">任务详情</a></td>' +
    '</tr>';
  }).join('');
}
/* 「总X个」hover：自定义 tooltip 展示全部语言 */
(function(){
  const tip = document.getElementById('lang-tip');
  document.addEventListener('mouseover', e => {
    const t = e.target.closest('.lg-total');
    if(t && t.getAttribute('data-tip')){
      tip.textContent = t.getAttribute('data-tip');
      tip.style.display = 'block';
      moveTip(e);
    }
  });
  document.addEventListener('mousemove', moveTip);
  document.addEventListener('mouseout', e => {
    if(e.target.closest && e.target.closest('.lg-total')) tip.style.display = 'none';
  });
  function moveTip(e){
    if(tip.style.display !== 'block') return;
    const pad = 14;
    let x = e.clientX + pad, y = e.clientY + pad;
    const r = tip.getBoundingClientRect();
    if(x + r.width > window.innerWidth - 8) x = e.clientX - r.width - pad;
    if(y + r.height > window.innerHeight - 8) y = e.clientY - r.height - pad;
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
  }
})();

    if(t && t.getAttribute('data-tip')){

      tip.style.display = 'block';
      moveTip(e);
    }
  });
  document.addEventListener('mousemove', moveTip);
  document.addEventListener('mouseout', e => {
    if(e.target.closest && e.target.closest('.app-merge')) tip.style.display = 'none';
  });
  function moveTip(e){
    if(tip.style.display !== 'block') return;
    const pad = 14;
    let x = e.clientX + pad, y = e.clientY + pad;
    const r = tip.getBoundingClientRect();
    if(x + r.width > window.innerWidth - 8) x = e.clientX - r.width - pad;
    if(y + r.height > window.innerHeight - 8) y = e.clientY - r.height - pad;
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
  }
})();

/* 下拉面板定位：fixed，避免被滚动容器裁剪 */
function placeSsPanel(input, panel){
  const raw = input.getBoundingClientRect();
  /* 多选框（chips 可能换行很高）锚到首行，避免整块高度把面板顶到上方 */
  const r = (input.classList && input.classList.contains('cfg-box'))
    ? { left: raw.left, right: raw.right, width: raw.width, top: raw.top, bottom: Math.min(raw.bottom, raw.top + 30) }
    : raw;
  const gap = 4, pad = 8, maxH = 300;
  panel.style.width = r.width + 'px';
  panel.style.left = r.left + 'px';
  const below = window.innerHeight - r.bottom - gap - pad;
  const above = r.top - gap - pad;
  const sh = panel.scrollHeight || maxH;
  const useBelow = (below >= Math.min(sh, 200)) || (below >= above);
  const h = Math.max(120, Math.min(sh, maxH, useBelow ? below : above));
  panel.style.maxHeight = h + 'px';
  panel.style.top = (useBelow ? (r.bottom + gap) : Math.max(pad, r.top - gap - h)) + 'px';
}
/* 容器滚动：聚焦中的面板跟随重定位，其余收起；面板自身滚动（滚轮翻选项）时忽略 */
function bindSsScroll(){
  if(bindSsScroll._b) return;
  bindSsScroll._b = true;
  document.addEventListener('scroll', e => {
    const t = e.target;
    document.querySelectorAll('.ss-panel.show').forEach(p => {
      if(t === p || (t && t.nodeType === 1 && p.contains(t))) return;
      const inp = p.parentElement && p.parentElement.querySelector('input');
      const anchor = p._anchor || inp;
      if(inp && document.activeElement === inp && anchor) placeSsPanel(anchor, p);
      else p.classList.remove('show');
    });
  }, true);
}
/* 绑定「选择应用」下拉多选：点击选项即勾选/取消，面板保持打开；支持输入筛选 */
function initCfgSelects(ct){

  bindSsScroll();
  const key = (ct === 'bd-diff-cfg') ? 'bd' : ct;
  c.querySelectorAll('.cfg-box[data-kind]').forEach(box => {
    if(box._cfgBound) return;
    box._cfgBound = true;
    const g = parseInt(box.dataset.g), n = parseInt(box.dataset.n);
    const kind = box.dataset.kind, ci = parseInt(box.dataset.c);
    const input = box.querySelector('input[data-role="cfg"]');
    const panel = box.querySelector('.ss-panel');
    const chipsEl = box.querySelector('.cfg-chips');
    const getArr = () => getCfgArr(key, g, n, kind, ci) || [];
    const renderChips = () => {
      const arr = getArr();
      chipsEl.innerHTML = arr.length
        ? arr.map(a => '<span class="cfg-chip">'+a+'<i class="cfg-x" data-v="'+a+'">×</i></span>').join('')
        : '<span class="cfg-ph">请选择应用</span>';
    };
    const renderPanel = kw => {
      const k = (kw || '').trim().toLowerCase();
      const sel = getArr();
      const list = ALL_APP_NAMES.filter(a => !k || a.toLowerCase().indexOf(k) >= 0);
      panel.innerHTML = list.length

        : '<div class="ss-empty">无匹配应用</div>';
    };
    const open = () => { panel._anchor = box; renderPanel(input.value); panel.classList.add('show'); placeSsPanel(box, panel); };
    input.addEventListener('focus', open);
    input.addEventListener('click', open);
    input.addEventListener('input', () => { panel._anchor = box; panel.classList.add('show'); renderPanel(input.value); placeSsPanel(box, panel); });
    input.addEventListener('blur', () => setTimeout(() => { panel.classList.remove('show'); input.value = ''; }, 150));
    const toggle = a => {
      const arr = getArr().slice();
      const i = arr.indexOf(a);
      if(i >= 0) arr.splice(i, 1); else arr.push(a);
      setCfgArr(key, g, n, kind, ci, arr);
      box.classList.remove('invalid');
      const err = box.parentElement && box.parentElement.querySelector('.cfg-err');
      if(err) err.classList.remove('show');
      renderChips();
      renderPanel(input.value);
      if(panel.classList.contains('show')) placeSsPanel(box, panel);
    };
    panel.addEventListener('mousedown', e => {
      const o = e.target.closest('.ss-opt');
      if(!o) return;
      e.preventDefault();   /* 保持输入框焦点，面板不关闭，可连续多选 */
      toggle(o.getAttribute('data-v'));
    });
    chipsEl.addEventListener('click', e => {
      const x = e.target.closest('.cfg-x');
      if(!x) return;
      e.stopPropagation();
      toggle(x.getAttribute('data-v'));
    });
  });
}

function markCfgErr(ct, g, n, kind, ci, msg){
  const box = document.querySelector('#'+ct+' .cfg-box[data-g="'+g+'"][data-n="'+n+'"][data-kind="'+kind+'"][data-c="'+ci+'"]');
  if(!box) return;

  if(err){ err.textContent = msg; err.classList.add('show'); }
}
function markGrpErr(ct, g, n, msg){
  const card = document.querySelector('#'+ct+' .grp-card[data-g="'+g+'"][data-n="'+n+'"]');
  if(!card) return;
  card.classList.add('invalid');
  const err = card.querySelector('.grp-err');
  if(err){ err.textContent = msg; err.classList.add('show'); }
}
function markSceneErr(ct, g){
  const item = document.querySelector('#'+ct+' .lg-scene-item[data-g="'+g+'"]');
  if(item) item.classList.add('has-error');
}
/* 同类型配置间应用重复：返回 [{cfg, x}]，x 为重复对象编号（剧名剧封=组号，仅剧封=配置号） */
function dupMark(list){
  const seen = new Map();
  const out = [];
  list.forEach(cfg => {
    let x = Infinity, dup = false;
    cfg.apps.forEach(a => {
      if(seen.has(a)){ dup = true; x = Math.min(x, seen.get(a)); }
      else seen.set(a, cfg.idx);
    });
    if(dup) out.push({cfg:cfg, x:x});
  });
  return out;
}
/* 每语言组维度校验：语言必选/配置非空/应用不重复/同组剧名剧封相等 */
function validateLangGroups(ct){
  renderLangGroups(ct); /* 重建以清除上一次标红 */
  const groups = groupsOf(ct);
  const mode = modeOf(ct);
  let ok = true;
  const seen = new Set();
  groups.forEach(lg => lg.langs.forEach(l => {
    if(seen.has(l)){ toast('语言组之间存在重复语言：'+l+'，请检查', 'error'); ok = false; }
    seen.add(l);
  }));
  if(!ok) return false;
  for(let g=0; g<groups.length; g++){
    const lg = groups[g];
    if(!lg.langs.length){ toast('语言组'+(g+1)+'：请选择语言', 'error'); return false; }
    /* 常用场景：只需选择场景，套数由场景决定 */
    if(sceneModeOf(lg) === 'common'){
      if(!lg.sceneId){ markSceneErr(ct, g); toast('语言组'+(g+1)+'：请选择场景', 'error'); return false; }
      continue;
    }
    if(mode === 'cover-only'){
      if(!lg.covers.length){ toast('语言组'+(g+1)+'：请至少添加一个剧封套', 'error'); ok = false; continue; }
      lg.covers.forEach((cv, ci) => {
        if(!cv.length){ markCfgErr(ct, g, 0, 'cover', ci, '请选择应用'); ok = false; }
      });
      dupMark(lg.covers.map((cv, ci) => ({ci:ci, idx:ci+1, apps:cv})))
        .forEach(b => { markCfgErr(ct, g, 0, 'cover', b.cfg.ci, '与剧封套'+b.x+'包含应用有重复'); ok = false; });
    }else{
      if(!lg.groups.length){ toast('语言组'+(g+1)+'：请至少添加一个剧名套', 'error'); ok = false; continue; }
      lg.groups.forEach((grp, n) => {
        if(!grp.name.length){ markCfgErr(ct, g, n, 'name', -1, '请选择应用'); ok = false; }
        if(!grp.covers.length){ markGrpErr(ct, g, n, '请至少添加一个剧封套'); ok = false; }
        grp.covers.forEach((cv, ci) => {
          if(!cv.length){ markCfgErr(ct, g, n, 'cover', ci, '请选择应用'); ok = false; }
        });
      });
      dupMark(lg.groups.map((grp, n) => ({n:n, idx:n+1, apps:grp.name})))
        .forEach(b => { markCfgErr(ct, g, b.cfg.n, 'name', -1, '与第'+b.x+'套包含应用有重复'); ok = false; });
      const coverCfgs = [];
      lg.groups.forEach((grp, n) => grp.covers.forEach((cv, ci) => coverCfgs.push({n:n, ci:ci, idx:n+1, apps:cv})));
      dupMark(coverCfgs).forEach(b => { markCfgErr(ct, g, b.cfg.n, 'cover', b.cfg.ci, '与第'+b.x+'套包含应用有重复'); ok = false; });
      lg.groups.forEach((grp, n) => {
        const ns = [...new Set(grp.name)];
        const cs = [...new Set([].concat.apply([], grp.covers))];
        if(ns.length !== cs.length || !ns.every(a => cs.includes(a))){
          markGrpErr(ct, g, n, '剧名-剧封套包含应用不相等'); ok = false;
        }
      });
    }
  }
  if(!ok){ toast('校验未通过，请检查标红项', 'error'); return false; }
  return true;
}

    });
    dupMark(lg.covers.map((cv, ci) => ({ci:ci, idx:ci+1, apps:cv})))
      .forEach(b => { markCfgErr('bd-diff-cfg', 0, 0, 'cover', b.cfg.ci, '与剧封套'+b.x+'包含应用有重复'); ok = false; });
  }else{
    if(!lg.groups.length){ toast('请至少添加一个剧名套', 'error'); ok = false; }
    lg.groups.forEach((grp, n) => {
      if(!grp.name.length){ markCfgErr('bd-diff-cfg', 0, n, 'name', -1, '请选择应用'); ok = false; }
      if(!grp.covers.length){ markGrpErr('bd-diff-cfg', 0, n, '请至少添加一个剧封套'); ok = false; }
      grp.covers.forEach((cv, ci) => {
        if(!cv.length){ markCfgErr('bd-diff-cfg', 0, n, 'cover', ci, '请选择应用'); ok = false; }
      });
    });
    dupMark(lg.groups.map((grp, n) => ({n:n, idx:n+1, apps:grp.name})))
      .forEach(b => { markCfgErr('bd-diff-cfg', 0, b.cfg.n, 'name', -1, '与第'+b.x+'套包含应用有重复'); ok = false; });
    const coverCfgs = [];
    lg.groups.forEach((grp, n) => grp.covers.forEach((cv, ci) => coverCfgs.push({n:n, ci:ci, idx:n+1, apps:cv})));
    dupMark(coverCfgs).forEach(b => { markCfgErr('bd-diff-cfg', 0, b.cfg.n, 'cover', b.cfg.ci, '与第'+b.x+'套包含应用有重复'); ok = false; });
    lg.groups.forEach((grp, n) => {
      const ns = [...new Set(grp.name)];
      const cs = [...new Set([].concat.apply([], grp.covers))];
      if(ns.length !== cs.length || !ns.every(a => cs.includes(a))){
        markGrpErr('bd-diff-cfg', 0, n, '剧名-剧封套包含应用不相等'); ok = false;
      }
    });
  }
  if(!ok){ toast('校验未通过，请检查标红项', 'error'); return false; }
  return true;
}
/* 批量导入：上传 + 模板 */

  bd.ids = document.getElementById('bd-ids').value.trim();
  const ids = bd.ids ? bd.ids.split(/[,，\s]+/).map(x=>x.trim()).filter(Boolean) : [];

/* ================= 初始化 ================= */
document.addEventListener('DOMContentLoaded', () => {
  pGroupMs = initMs('p-group-box','p-group-content','p-group-panel', GROUP_OPTS, arr=>{ pFilter.groups = arr; });
  pTypeMs  = initMs('p-type-box','p-type-content','p-type-panel', TYPE_OPTS, arr=>{ pFilter.types = arr; });
  pPayMs   = initMs('p-pay-box','p-pay-content','p-pay-panel', PAY_OPTS, arr=>{ pFilter.pays = arr; });
  /* 筛选下拉枚举：剧本系列 / 上线语种 */
  const seriesOpts = [...new Set(orders.map(o=>o.series))];
  document.getElementById('f-series').innerHTML = '<option value="">请选择剧本系列</option>' + seriesOpts.map(s=>'<option>'+s+'</option>').join('');
  document.getElementById('f-langs').innerHTML = '<option value="">请选择上线语种</option>' + LANGUAGES.map(l=>'<option>'+l+'</option>').join('');

  /* 选择应用子页面 */
  /* picker 取消/×/遮罩关闭 */
document.querySelectorAll('[data-close="picker-modal"]').forEach(b => b.addEventListener('click', ()=>document.getElementById('picker-modal').classList.remove('show')));
document.getElementById('picker-modal').addEventListener('click', e => { if(e.target === document.getElementById('picker-modal')) document.getElementById('picker-modal').classList.remove('show'); });
  document.getElementById('p-search').addEventListener('click', ()=>{
    pFilter.name = document.getElementById('p-name').value;
    renderPickerTable();
  });
  document.getElementById('p-reset').addEventListener('click', ()=>{
    document.getElementById('p-name').value = '';
    pGroupMs.clear(); pTypeMs.clear(); pPayMs.clear();
    pFilter.name=''; pFilter.groups=[]; pFilter.types=[]; pFilter.pays=[];
    renderPickerTable();
  });
  document.getElementById('p-tbody').addEventListener('click', e => {
    const cb = e.target.closest('input[type=checkbox]');
    if(!cb) return;
    const app = APPS.find(a => a.id === cb.getAttribute('data-id'));
    if(cb.checked){ if(!pickerSel.includes(app.name)) pickerSel.push(app.name); }
    else pickerSel = pickerSel.filter(v => v !== app.name);
    renderPickerTags();
    const boxes = [...document.querySelectorAll('#p-tbody input[type=checkbox]')];
    document.getElementById('p-checkall').checked = boxes.length > 0 && boxes.every(b=>b.checked);
  });
  document.getElementById('p-checkall').addEventListener('change', e => {
    const checked = e.target.checked;
    document.querySelectorAll('#p-tbody input[type=checkbox]').forEach(cb => {
      if(cb.disabled) return;
      const app = APPS.find(a => a.id === cb.getAttribute('data-id'));
      cb.checked = checked;
      if(checked){ if(!pickerSel.includes(app.name)) pickerSel.push(app.name); }
      else pickerSel = pickerSel.filter(v => v !== app.name);
    });
    renderPickerTags();
  });
  document.getElementById('p-ok').addEventListener('click', () => {
    if(!pickerCtx) return;
    const arr = pickerSel.slice();
    setCfgArr(pickerCtx.ct, pickerCtx.g, pickerCtx.n, pickerCtx.kind, pickerCtx.c, arr);
    if(modeOf(pickerCtx.ct) === 'name-cover'){
      const grp = groupsOf(pickerCtx.ct)[pickerCtx.g].groups[pickerCtx.n];
      if(grp){
        if(pickerCtx.kind === 'name'){
          /* 剧名变更：剧封应用收敛至剧名范围内；第一套剧封为空时默认填入剧名应用 */
          grp.covers = grp.covers.map(cv => cv.filter(a => arr.includes(a)));
          if(grp.covers.length && !grp.covers[0].length) grp.covers[0] = arr.slice();
        }else if(pickerCtx.kind === 'cover'){
          /* 剧封套选择：其他剧封套中已被本套选择的应用自动移除 */
          grp.covers.forEach((cv, i) => {
            if(i !== pickerCtx.c) grp.covers[i] = cv.filter(a => !arr.includes(a));
          });
        }
      }
    }
    if(pickerCtx.ct === 'bd'){ renderBdDiffCfg(); }
    else{ renderLangGroups(pickerCtx.ct); }
    document.getElementById('picker-modal').classList.remove('show');
  });
  /* 跨页全选：当前搜索结果全部应用 选中/清空 */
  document.getElementById('p-select-all').addEventListener('click', () => {
    const list = pSelectable();
    if(!list.length) return;
    const all = list.every(a => pickerSel.includes(a.name));
    if(all){
      const names = new Set(list.map(a => a.name));
      pickerSel = pickerSel.filter(v => !names.has(v));
    }else{
      list.forEach(a => { if(!pickerSel.includes(a.name)) pickerSel.push(a.name); });
    }
    renderPickerTags();
    renderPickerTable();
  });

  /* 新增语言组 */
  document.getElementById('btn-add-lang').addEventListener('click', ()=>{
    const ct = 'diff-lang-groups';
    if(modeOf(ct) === 'cover-only') cw.coverLangGroups.push({langs:[], sceneId:null, sceneMode:'common', covers:[[]]});
    else cw.diffLangGroups.push({langs:[], sceneId:null, sceneMode:'common', groups:[{name:[], covers:[[]]}]});
    renderLangGroups(ct);
  });

  /* 未开放菜单 */
  document.querySelectorAll('.sidebar-item[data-page]').forEach(el => {
    el.addEventListener('click', () => toast('新版「'+el.getAttribute('data-page')+'」暂未开放，可访问旧版 demo 查看', 'warning'));
  });

  renderTable();
  locLangMs = initMs('loc-lang-box','loc-lang-content','loc-lang-panel', LANGUAGES, ()=>{}, true);
  locLangMs.setValue(['英语','西班牙语','日语']);
  posterLangMs = initMs('poster-lang-box','poster-lang-content','poster-lang-panel', LANGUAGES, ()=>{}, true);
  posterLangMs.setValue(['英语','西班牙语','日语']);
  renderAll();
});
</script>
